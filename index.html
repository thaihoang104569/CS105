<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sci-Fi Shooting Range 3D</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="ui">
      <div class="ui-panel">
        <div class="title">Sci-Fi Shooting Range 3D</div>
        <div class="row">
          <label for="textureSelect">Floor Texture</label>
          <select id="textureSelect">
            <option value="grid" selected>Digital Grid</option>
            <option value="brick">Brick</option>
            <option value="metal">Metal Sheet</option>
          </select>
        </div>
        <div class="row">
          <label for="textureFileInput">Custom Image</label>
          <input id="textureFileInput" type="file" accept="image/*" />
        </div>
        <div class="row">
          <span class="label">Camera</span>
          <span class="hint">Press 1 (Panoramic) or 2 (Third-Person)</span>
        </div>
        <div class="row sliders">
          <div class="slider">
            <label for="camX">X</label>
            <input id="camX" type="range" min="-60" max="60" value="20" step="1" />
          </div>
          <div class="slider">
            <label for="camY">Y</label>
            <input id="camY" type="range" min="5" max="80" value="25" step="1" />
          </div>
          <div class="slider">
            <label for="camZ">Z</label>
            <input id="camZ" type="range" min="-60" max="60" value="20" step="1" />
          </div>
        </div>
        <div class="row sliders">
          <div class="slider">
            <label for="camNear">Near</label>
            <input id="camNear" type="range" min="0.1" max="50" value="0.5" step="0.1" />
          </div>
          <div class="slider">
            <label for="camFar">Far</label>
            <input id="camFar" type="range" min="50" max="300" value="180" step="5" />
          </div>
        </div>
        <div class="row score">
          <span>Targets Eliminated:</span>
          <span id="scoreValue">0</span>
        </div>
        <div class="row">
          <span class="label">Lighting</span>
        </div>
        <div class="row sliders">
          <div class="slider">
            <label for="ambientIntensity">Ambient</label>
            <input id="ambientIntensity" type="range" min="0" max="1.2" value="0.68" step="0.02" />
          </div>
          <div class="slider">
            <label for="directionalIntensity">Directional</label>
            <input id="directionalIntensity" type="range" min="0" max="1.5" value="0.92" step="0.02" />
          </div>
          <div class="slider">
            <label for="pointIntensity">Point</label>
            <input id="pointIntensity" type="range" min="0" max="4" value="2" step="0.05" />
          </div>
        </div>
        <div class="row">
          <button id="restartButton" class="action-button" type="button">Restart Game</button>
        </div>
        <div class="row hint">WASD move, mouse to aim, click to shoot</div>
      </div>
    </div>
    <canvas id="scene"></canvas>
    <div id="crosshair" aria-hidden="true"></div>
    <div id="loadingStatus"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "fflate": "https://unpkg.com/fflate@0.8.2/esm/browser.js"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
